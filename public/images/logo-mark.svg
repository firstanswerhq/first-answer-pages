<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 48" width="64" height="48" role="img" aria-label="First Answer Pages open book">
  <title>First Answer Pages</title>
  <!-- cover edge -->
  <path d="M3 9.5 C 12 6.5, 22 6.8, 32 11 C 42 6.8, 52 6.5, 61 9.5 L 61 42 C 52 39.2, 42 39.4, 32 43.5 C 22 39.4, 12 39.2, 3 42 Z" fill="#0C2C73"/>
  <!-- pages -->
  <path d="M6 8 C 14.5 5.2, 23.5 5.6, 31 9.4 L 31 40.4 C 23.5 36.8, 14.5 36.5, 6 39 Z" fill="#FBF4E2" stroke="#0C2C73" stroke-width="1.6" stroke-linejoin="round"/>
  <path d="M58 8 C 49.5 5.2, 40.5 5.6, 33 9.4 L 33 40.4 C 40.5 36.8, 49.5 36.5, 58 39 Z" fill="#FBF4E2" stroke="#0C2C73" stroke-width="1.6" stroke-linejoin="round"/>
  <!-- left page: phone-book entries with dot leaders -->
  <g stroke="#0C2C73" stroke-linecap="round">
    <path d="M10 14.2 C 13 13.4, 16 13.2, 18.5 13.3" stroke-width="1.8"/>
    <path d="M20.5 13.5 L 27.5 14.6" stroke-width="1.2" stroke-dasharray="0.1 2"/>
    <path d="M10 20.2 C 13 19.4, 15 19.2, 16.5 19.3" stroke-width="1.8"/>
    <path d="M18.5 19.4 L 27.5 20.6" stroke-width="1.2" stroke-dasharray="0.1 2"/>
    <path d="M10 26.2 C 13 25.4, 16.5 25.2, 19.5 25.4" stroke-width="1.8"/>
    <path d="M21.5 25.6 L 27.5 26.6" stroke-width="1.2" stroke-dasharray="0.1 2"/>
    <path d="M10 32.2 C 12.5 31.5, 14.5 31.3, 15.5 31.4" stroke-width="1.8"/>
    <path d="M17.5 31.5 L 27.5 32.6" stroke-width="1.2" stroke-dasharray="0.1 2"/>
  </g>
  <!-- right page: the first answer, checked -->
  <path d="M37.5 14.6 C 41 13.4, 46 13.1, 53.5 13.8" stroke="#0C2C73" stroke-width="1.8" stroke-linecap="round" fill="none"/>
  <path d="M38.5 24.8 l 3.6 3.8 l 8.2 -9.4" stroke="#9B2C2C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M37.5 33.6 C 41 32.6, 46 32.4, 53.5 33.2" stroke="#0C2C73" stroke-width="1.8" stroke-linecap="round" fill="none" opacity=".55"/>
  <!-- ribbon bookmark -->
  <path d="M43.5 37.6 L 43.5 46.5 L 46 44.4 L 48.5 46.5 L 48.5 37.2" fill="#9B2C2C"/>
</svg>
